<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Udemy</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="navbar">
      <div class="navbar_heading">
        <h1>Udemy</h1>
      </div>
      <div class="navbar_search">
        <i class="fa-solid fa-magnifying-glass" style="color: rgb(0, 0, 0)"></i>
        <input type="text" placeholder="Search..." />
      </div>
      <div class="navbar_icons">
        <a href="https://www.meesho.com/" style="color: black; text-decoration: none;">Courses</a>
        <i class="fa-solid fa-cart-arrow-down" style="color: rgb(0, 0, 0)"></i>
        <i class="fa-solid fa-user" style="color: rgb(0, 0, 0)"></i>
      </div>
    </div>
    <div class="category">
      <button>Development</button>
      <button>Business</button>
      <button>Software</button>
      <button>Design</button>  
    </div>

    <div class="hero_image">
        <img src="./assets/hero_image.jpg" alt="hero_image">
    </div>
  </body>
</html>
